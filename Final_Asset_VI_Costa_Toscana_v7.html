  cur: null, tr: null, t0: 0, timer: null, sched: 0,
  play(name) {
    if (this.cur === name) return;
    AU.pending = name; this.cur = name; this.stop(true);
    if (!AU.ctx || !AU.on) return;
    const d = TRACKS[name]; if (!d) return;
    this.tr = { d, v: { lead: parseVoice(d.lead), harm: parseVoice(d.harm), bass: parseVoice(d.bass), drums: d.drums ? parseDrums(d.drums) : null } };
    this.tr.len = Math.max(...['lead', 'harm', 'bass', 'drums'].map(k => this.tr.v[k] ? this.tr.v[k].len : 0));
    this.tr.stepT = 60 / d.bpm / 4; this.t0 = AU.ctx.currentTime + 0.08; this.sched = 0;
    this.timer = setInterval(() => this.tick(), 60);
  },
  stop(keep) { if (this.timer) clearInterval(this.timer); this.timer = null; this.tr = null; if (!keep) this.cur = null; },
  tick() {
    const tr = this.tr; if (!tr || !AU.ctx) return;
    const ahead = AU.ctx.currentTime + 0.35;
    while (true) {
      const loopI = Math.floor(this.sched / tr.len), st = this.sched % tr.len;
      const tt = this.t0 + this.sched * tr.stepT; if (tt > ahead) break;
      if (!tr.d.loop && loopI >= 1) { this.stop(); return; }
      const s = tr.stepT;
      for (const e of tr.v.lead.ev) if (e.s === st) tone(e.f, tt, Math.max(0.05, e.d * s * 0.92), 'square', 0.085);
      for (const e of tr.v.harm.ev) if (e.s === st) tone(e.f, tt, Math.max(0.05, e.d * s * 0.9), 'triangle', 0.09);
      for (const e of tr.v.bass.ev) if (e.s === st) tone(e.f / 2, tt, Math.max(0.05, e.d * s * 0.85), 'triangle', 0.17);
      if (tr.v.drums) for (const e of tr.v.drums.ev) if (e.s === st) { if (e.k === 'k') tone(110, tt, 0.1, 'sine', 0.3, -70); else if (e.k === 's') noise(tt, 0.09, 0.14); else noise(tt, 0.03, 0.05); }
      this.sched++;
    }
  },
  setOn(on) { AU.on = on; const c = this.cur; if (!on) { this.stop(true); this.cur = c; } else { this.cur = null; if (c) this.play(c); } }
};

function fit() {
  const touch = matchMedia('(pointer:coarse)').matches || innerWidth < 640;
  document.body.classList.toggle('touch', touch);
  const ctlH = touch ? 150 : 0;
  const aw = innerWidth, ah = innerHeight - ctlH - (touch ? 28 : 0);
  let s = Math.min(aw / W, ah / H); if (s >= 2) s = Math.floor(s);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit);

  toast(t, snd) { this.toastTxt = t; this.toastT = 3; if (snd) sfx(snd); }
  mini(scn) { return cb => { scn.finish = res => { setScene(this); this.fadeA = 1; this.fd = { from: 1, to: 0, t: 0, dur: 0.3, cb: null }; cb(res); }; setScene(scn); }; }
  startPrologue() {
    this.fadeA = 1; this.refreshNpcs();
    this.run(function* (F) {
      yield F.fade(0, 0.8);
      yield F.say([
        ['RICCARDO', 'Andrea. Tra due ore parte la riunione più importante della crociera e la sala del Comandante non ha ancora un account. Inaccettabile.'],
        ['ANDREA', "Lo so, Riccà. Er guaio è che 'a sala riunioni sua nun c'ha ancora l'account."],

const SWAP_LEVELS = [
  ['#######', '#@    #', '#  $  #', '#  .  #', '#######'],
  ['#########', '#@      #', '#  $ $  #', '#  . .  #', '#       #', '#########'],
  ['#########', '#  #    #', '# $$ $  #', '#@ #  . #', '#     . #', '#     . #', '#########'],
];
class SwapScene {
  constructor() { this.finish = () => { }; }
  enter() { this.lv = 0; this.t = 0; this.ph = 'play'; this.menu = null; this.done = 0; this.rep = 0; this.loadLevel(); Music.play('work'); }
  loadLevel() {
    const L = SWAP_LEVELS[this.lv]; this.w = Math.max(...L.map(r => r.length)); this.h = L.length;
    this.walls = new Set(); this.targets = []; this.boxes = []; this.hist = []; this.moves = 0; this.dir = 'down';
    L.forEach((r, y) => [...r].forEach((c, x) => { if (c === '#') this.walls.add(x + ',' + y); if (c === '.' || c === '*') this.targets.push([x, y]); if (c === '$' || c === '*') this.boxes.push([x, y]); if (c === '@') { this.px = x; this.py = y; } }));
  }
  solved() { return this.targets.every(t => this.boxes.some(b => b[0] === t[0] && b[1] === t[1])); }
  tryMove(d) {

    if (this.walls.has(nx + ',' + ny)) return;

    if (bi >= 0) {
      const bx = nx + dx, by = ny + dy;
      if (this.walls.has(bx + ',' + by) || this.boxes.some(b => b[0] === bx && b[1] === by)) { sfx('err'); return; }
      this.boxes[bi] = [bx, by]; sfx('hit');
    } else sfx('blip');

    if (this.solved()) { this.ph = 'clear'; this.t = 0; sfx('lvl'); }
  }
  update(dt) {

    if (this.ph === 'end') { if (this.t > 0.4 && (hit('ok') || hit('cancel'))) { sfx('ok'); this.finish({ ok: true }); } return; }

      return;
    }
    if (hit('ok')) { this.menu = { cur: 0 }; sfx('ok'); return; }
    if (hit('cancel')) { const s = this.hist.pop(); if (s) { this.px = s.px; this.py = s.py; this.boxes = s.boxes; this.moves = Math.max(0, this.moves - 1); sfx('cancel'); } return; }
    for (const d of ['up', 'down', 'left', 'right']) {

class Battle {
  constructor(field, enemyIds, opts, onEnd) {

    this.party = G.party.map((m, i) => mkPartyF(m, i));

    this.phase = 'intro'; this.introT = 1.5; this.fadeIn = 1; this.endFade = 0; this.evo = 0; this.summonShow = null; this.enemies.forEach(e => { G.seen[e.id] = true; });
    this.msg = { text: (opts.boss || opts.mini) ? this.enemies[0].name + ' si para davanti a voi!' : this.enemies.map(e => e.name).filter((v, i, a) => a.indexOf(v) === i).join(', ') + ' appare!', t: 99 };
    this.party.forEach(f => { if (f.hp <= 0) f.atb = 0; });
  }

    const E = this.enemies, n = E.length;
    if (E[0].boss || E[0].mini) { const e = E[0]; e.x = 6; e.y = 146 - e.h; return; }
    const pos = n === 1 ? [[64, 132]] : n === 2 ? [[22, 118], [84, 138]] : [[14, 104], [74, 124], [30, 142]];
    E.forEach((e, i) => { e.x = pos[i][0]; e.y = pos[i][1] - e.h; });
  }
  alive(team) { return (team === 'p' ? this.party : this.enemies).filter(f => f.hp > 0); }
  later(sec, fn) { this.timers.push({ t: this.clock + sec, fn }); }

  /* ---------------- aggiornamento ---------------- */
  update(dt) {
    this.clock += dt; G.time += dt;
    for (const tm of this.timers) if (!tm.done && this.clock >= tm.t) { tm.done = true; tm.fn(); }
    this.timers = this.timers.filter(t => !t.done);
    if (this.fadeIn > 0) this.fadeIn = Math.max(0, this.fadeIn - dt * 2.5);
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt);
    if (this.flashScr > 0) this.flashScr = Math.max(0, this.flashScr - dt * 2);
    this.pop = this.pop.filter(p => (p.t += dt) < p.life); this.fx = this.fx.filter(x => (x.t += dt) < x.dur + (x.d || 0));
    this.enemies.forEach(e => { if (e.dying >= 0 && e.dying < 1) e.dying = Math.min(1, e.dying + dt / (e.boss ? 1.6 : 0.6)); if (e.flash > 0) e.flash = Math.max(0, e.flash - dt * 4); if (e.puff > 0) e.puff = Math.max(0, e.puff - dt * 0.7); });
    this.party.forEach(f => { if (f.flash > 0) f.flash = Math.max(0, f.flash - dt * 4); if (f.gag > 0) f.gag = Math.max(0, f.gag - dt); });
    if (this.msg && this.msg.t !== 99) { this.msg.t -= dt; if (this.msg.t <= 0) this.msg = null; }
    if (this.phase === 'intro') { this.introT -= dt; if (this.introT <= 0) { this.phase = 'active'; this.msg = null; } return; }
    if (this.phase === 'results') { this.updateResults(dt); return; }
    if (this.phase === 'ended') return;
    if (this.co) { this.coT -= dt; let guard = 0; while (this.co && this.coT <= 0 && guard++ < 50) { const r = this.co.next(); if (r.done) { this.co = null; this.afterAction(); } else this.coT = r.value || 0; } return; }
    if (this.menu) { this.menuUpdate(); return; }
    for (const f of [...this.party, ...this.enemies]) {
      if (f.hp <= 0) continue;
      const st = f.st;
      if (st.pending > 0) { st.pending -= dt; continue; }
      if (st.haste > 0) st.haste -= dt; if (st.defdown > 0) st.defdown -= dt; else delete st.defdown;
      if (f.atb < 1) {
        let r = 0.095 + f.spd * 0.0115; if (st.haste > 0) r *= 1.8; if (f.boss && f.phase === 2) r *= 1.25; if (f.boss) r *= 0.92;
        f.atb = Math.min(1, f.atb + r * dt);
        if (f.atb >= 1) this.readyQ.push(f);
      }
    }
    while (this.readyQ.length && !this.co && !this.menu) {
      const f = this.readyQ.shift(); if (f.hp <= 0 || f.atb < 1) continue;

  itemList() { return Object.keys(G.inv).filter(k => G.inv[k] > 0 && !ITEMS[k].gear); }
  summonList() { return Object.keys(SUMMONS).filter(k => G.flags[SUMMONS[k].flag]); }
  beginTarget(kind, pick) {
